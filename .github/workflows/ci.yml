name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check locale catalogues
        run: node .github/scripts/check-locales.mjs
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: browseraway
          path: web-ext-artifacts/*.zip
